server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:nacos:common.yaml
  cloud:
    nacos:
      config:
        server-addr: 192.168.10.114:8848
        username: nacos
        password: ${NACOS_PASSWORD}
      discovery:
        server-addr: 192.168.10.114:8848
        username: nacos
        password: ${NACOS_PASSWORD}
    gateway:
      routes:
        - id: UserSystem
          uri: lb://user-service
          predicates:
            - Path=/api/userservice/**

sw:
  auth:
    excludePaths:
      - /api/userservice/public/**
    # 系统标识（app_key）→ 路径前缀（Ant 风格）映射，用于校验 token 的 app_key 与路由匹配
    app-route-mapping:
      UserSystem: /api/userservice/**
