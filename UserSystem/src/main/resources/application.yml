server:
  port: 8081

spring:
  application:
    name: user-service
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  config:
    import:
      - optional:nacos:common.yaml
  cloud:
    nacos:
      config:
        server-addr: 192.168.10.114:8848
        username: nacos
        password: ${NACOS_PASSWORD}
      discovery:
        server-addr: 192.168.10.114:8848
        username: nacos
        password: ${NACOS_PASSWORD}
      openfeign:
        circuitbreaker:
          enabled: true
  datasource:
    url: jdbc:postgresql://${db.host}:${db.port}/staticworld_usersystem_db
  mail:
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.user: debug
